workflows:
  react-native-ios:
    name: Brahmanand School iOS and iPadOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Archive
        script: |
          unzip -o Brahmanand-iOS-Reconstructed.zip
          cp -R mnt/data/Brahmanand-iOS-Reconstructed/. .
          rm -rf mnt Brahmanand-iOS-Reconstructed.zip
      - name: Install Node Modules
        script: |
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          PROJ_DIR=$(find . -name "*.xcodeproj" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$PROJ_DIR"
          if [ ! -f Podfile ]; then
            pod init
          fi
          pod install
      - name: Build Unsigned iOS Application
        script: |
          XCODEPROJECT=$(find . -name "*.xcodeproj" -not -path "*/node_modules/*" | head -n 1)
          PROJ_DIR=$(dirname "$XCODEPROJECT")
          cd "$PROJ_DIR"
          SCHEME_NAME=$(basename "$XCODEPROJECT" .xcodeproj)
          
          xcodebuild -project "$SCHEME_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/build/Build/Products/Release-iphoneos/*.ipa"
      - "**/*.ipa"
