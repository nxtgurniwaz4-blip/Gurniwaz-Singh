workflows:
  react-native-ios:
    name: Brahmanand School iOS and iPadOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Archive
        script: |
          echo "Extracting the actual zip archive..."
          unzip -o Brahmanand-iOS-Reconstructed-final.zip || unzip -o *.zip
          
          echo "Moving nested files up..."
          # Since it was created on an iPad, it unzips into an inner folder structure
          # Move everything from the extracted folder to the main directory
          EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "BrahmanandPublicSchool*" | head -n 1)
          if [ -z "$EXTRACTED_DIR" ]; then
            EXTRACTED_DIR=$(find . -maxdepth 3 -type d -name "iOS" -o -name "ios" | head -n 1 | xargs dirname)
          fi
          
          echo "Target folder found at: $EXTRACTED_DIR"
          cp -R "$EXTRACTED_DIR"/. . || true
      - name: Install Node Modules
        script: |
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          cd iOS || cd ios || cd BrahmanandPublicSchool/iOS || cd BrahmanandPublicSchool/ios
          if [ ! -f Podfile ]; then
            pod init
          fi
          pod install
      - name: Build Unsigned iOS Application
        script: |
          cd iOS || cd ios || cd BrahmanandPublicSchool/iOS || cd BrahmanandPublicSchool/ios
          SCHEME_NAME=$(basename *.xcodeproj .xcodeproj)
          xcodebuild -project "$SCHEME_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/build/Build/Products/Release-iphoneos/*.ipa"
      - "**/*.ipa"
