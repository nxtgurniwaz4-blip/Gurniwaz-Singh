workflows:
  react-native-ios:
    name: Brahmanand School iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Archive
        script: |
          unzip -o Brahmanand-iOS-Reconstructed.zip
          cp -R mnt/data/Brahmanand-iOS-Reconstructed/. .
          rm -rf mnt Brahmanand-iOS-Reconstructed.zip
      - name: Install Node Modules
        script: |
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          cd iOS
          if [ ! -f Podfile ]; then
            pod init
          fi
          pod install
          cd ..
      - name: Build Unsigned iOS Application
        script: |
          cd iOS
          xcodebuild -project BrahmanandPublicSchool.xcodeproj \
            -scheme BrahmanandPublicSchool \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/*.ipa"
