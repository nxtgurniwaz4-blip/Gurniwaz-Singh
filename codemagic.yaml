workflows:
  react-native-ios:
    name: Brahmanand School iOS and iPadOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Archive
        script: |
          echo "Extracting the app archive..."
          unzip -o Brahmanand-iOS-Reconstructed-final.zip
          
          echo "Locating workspace core paths..."
          # Find where the project root files actually live
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PKG_DIR=$(dirname "$PKG_PATH")
          
          # Move all project content directly out to the main execution directory
          cp -R "$PKG_DIR"/. .
          rm -rf Brahmanand-iOS-Reconstructed-final.zip
      - name: Install Node Modules
        script: |
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          XCODE_DIR=$(find . -name "*.xcodeproj" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$XCODE_DIR"
          if [ ! -f Podfile ]; then
            pod init
          fi
          pod install
      - name: Build Unsigned iOS Application
        script: |
          XCODEPROJECT=$(find . -name "*.xcodeproj" -not -path "*/node_modules/*" | head -n 1)
          PROJ_DIR=$(dirname "$XCODEPROJECT")
          cd "$PROJ_DIR"
          SCHEME_NAME=$(basename "$XCODEPROJECT" .xcodeproj)
          
          xcodebuild -project "$SCHEME_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/build/Build/Products/Release-iphoneos/*.ipa"
      - "**/*.ipa"
