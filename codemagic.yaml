workflows:
  react-native-ios:
    name: Brahmanand School iOS and iPadOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Archive
        script: |
          unzip -o Brahmanand-iOS-Reconstructed.zip
          # Force copy anything nested deeply up into the working root
          find . -name "package.json" -not -path "*/node_modules/*" -exec cp -R {}/.. . \; 2>/dev/null || true
          find . -name "*.xcodeproj" -not -path "*/node_modules/*" -exec cp -R {}/.. . \; 2>/dev/null || true
      - name: Install Node Modules
        script: |
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          # Target the native folder layer directly
          cd ios || cd iOS || cd BrahmanandPublicSchool || cd *xcodeproj/..
          if [ ! -f Podfile ]; then
            pod init
          fi
          pod install
      - name: Build Unsigned iOS Application
        script: |
          cd ios || cd iOS || cd BrahmanandPublicSchool || cd *xcodeproj/..
          SCHEME_NAME=$(basename *.xcodeproj .xcodeproj)
          xcodebuild -project "$SCHEME_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/build/Build/Products/Release-iphoneos/*.ipa"
      - "**/*.ipa"
