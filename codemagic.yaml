workflows:
  ios-build:
    name: Brahmanand IPA

    environment:
      xcode: latest
      cocoapods: default

    scripts:

      - name: Extract project
        script: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          rm -rf extracted_project
          mkdir extracted_project

          unzip -q -o "$ZIP_FILE" -d extracted_project

          PROJECT=$(find extracted_project -type d -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir"
          echo "$PROJECT" > "$CM_BUILD_DIR/project"

          echo "Project: $PROJECT"

      - name: CocoaPods
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          cd "$PROJECT_DIR"

          if [ -f Podfile ] && grep -qE '^[[:space:]]*pod[[:space:]]' Podfile; then
            echo "Installing CocoaPods dependencies..."
            pod install
          else
            echo "No CocoaPods dependencies. Skipping."
          fi

      - name: Build IPA
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          PROJECT=$(cat "$CM_BUILD_DIR/project")

          cd "$PROJECT_DIR"

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{getline; gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not find Xcode scheme."
            xcodebuild -project "$PROJECT" -list
            exit 1
          fi

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Brahmanand.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        script: |
          set -e

          APP=$(find \
            "$CM_BUILD_DIR/Brahmanand.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Xcode did not produce an .app."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/Payload"
          mkdir "$CM_BUILD_DIR/Payload"

          cp -R "$APP" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"

          zip -qr Brahmanand.ipa Payload

          echo "IPA created:"
          ls -lh Brahmanand.ipa

    artifacts:
      - $CM_BUILD_DIR/Brahmanand.ipa
