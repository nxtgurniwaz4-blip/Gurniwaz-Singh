workflows:
  ios-build:
    name: Brahmanand IPA

    environment:
      xcode: latest
      cocoapods: default

    scripts:

      - name: Extract project
        script: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q -o "$ZIP_FILE" -d extracted_project

          PROJECT=$(find extracted_project -type d -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir"
          echo "$PROJECT_NAME" > "$CM_BUILD_DIR/project_name"

          echo "Project directory: $PROJECT_DIR"
          echo "Project name: $PROJECT_NAME"

      - name: CocoaPods
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          cd "$PROJECT_DIR"

          if [ -f Podfile ] && grep -qE '^[[:space:]]*pod[[:space:]]' Podfile; then
            pod install
          else
            echo "No CocoaPods dependencies. Skipping."
          fi

      - name: Find Scheme
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          PROJECT_NAME=$(cat "$CM_BUILD_DIR/project_name")

          cd "$PROJECT_DIR"

          echo "Checking project:"
          pwd
          ls -la

          xcodebuild -project "$PROJECT_NAME" -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list 2>/dev/null |
            awk '
              /Schemes:/ {
                getline
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not find Xcode scheme."
            exit 1
          fi

          echo "$SCHEME" > "$CM_BUILD_DIR/scheme"

          echo "Using scheme: $SCHEME"

      - name: Build Archive
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          PROJECT_NAME=$(cat "$CM_BUILD_DIR/project_name")
          SCHEME=$(cat "$CM_BUILD_DIR/scheme")

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Brahmanand.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        script: |
          set -e

          APP=$(find \
            "$CM_BUILD_DIR/Brahmanand.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/Payload"
          mkdir -p "$CM_BUILD_DIR/Payload"

          cp -R "$APP" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"

          zip -qr Brahmanand.ipa Payload

          echo "================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "================================"
          ls -lh Brahmanand.ipa

    artifacts:
      - $CM_BUILD_DIR/Brahmanand.ipa
      - $CM_BUILD_DIR/Brahmanand.xcarchive/**
