workflows:
  react-native-ios:
    name: Brahmanand School iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip and Align Project Files
        script: |
          unzip -o *.zip
      - name: Install Node Modules
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          yarn install --no-immutable
      - name: Install CocoaPods Dependencies
        script: |
          IOS_DIR=$(find . -name "Podfile" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$IOS_DIR"
          pod install
      - name: Build Unsigned iOS Application
        script: |
          XCODE_DIR=$(find . -name "*.xcworkspace" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$XCODE_DIR"
          SCHEME_NAME=$(basename *.xcworkspace .xcworkspace)
          xcodebuild -workspace "$SCHEME_NAME.xcworkspace" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build
    artifacts:
      - ios/build/Build/Products/Release-iphoneos/*.app
      - ios/*.ipa
      - "*.ipa"
