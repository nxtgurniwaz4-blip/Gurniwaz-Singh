workflows:
  ios-build:
    name: Brahmanand iOS IPA

    environment:
      xcode: latest
      cocoapods: default

    scripts:

      - name: Extract project ZIP
        script: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          unzip -q -o "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted_project"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d -name "*.xcodeproj" -print -quit)

          WORKSPACE=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d -name "*.xcworkspace" \
            ! -name "Pods.xcworkspace" \
            -print -quit)

          if [ -n "$WORKSPACE" ]; then
            PROJECT_DIR=$(dirname "$WORKSPACE")
          elif [ -n "$PROJECT" ]; then
            PROJECT_DIR=$(dirname "$PROJECT")
          else
            echo "ERROR: ZIP does not contain an Xcode project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir"

      - name: Install CocoaPods
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          cd "$PROJECT_DIR"

          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile found — skipping CocoaPods."
          fi

      - name: Detect Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          cd "$PROJECT_DIR"

          WORKSPACE=$(find . -maxdepth 1 -type d \
            -name "*.xcworkspace" \
            ! -name "Pods.xcworkspace" \
            -print -quit)

          PROJECT=$(find . -maxdepth 1 -type d \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_TYPE=workspace" > "$CM_BUILD_DIR/build_info"
            echo "BUILD_FILE=$WORKSPACE" >> "$CM_BUILD_DIR/build_info"

            xcodebuild -workspace "$WORKSPACE" -list

          elif [ -n "$PROJECT" ]; then
            echo "BUILD_TYPE=project" > "$CM_BUILD_DIR/build_info"
            echo "BUILD_FILE=$PROJECT" >> "$CM_BUILD_DIR/build_info"

            xcodebuild -project "$PROJECT" -list

          else
            echo "ERROR: No Xcode project found."
            exit 1
          fi

      - name: Build Archive
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir")
          cd "$PROJECT_DIR"

          source "$CM_BUILD_DIR/build_info"

          if [ "$BUILD_TYPE" = "workspace" ]; then
            SCHEME=$(xcodebuild \
              -workspace "$BUILD_FILE" \
              -list 2>/dev/null |
              awk '/Schemes:/{getline; gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')

            xcodebuild \
              -workspace "$BUILD_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Brahmanand.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO

          else
            SCHEME=$(xcodebuild \
              -project "$BUILD_FILE" \
              -list 2>/dev/null |
              awk '/Schemes:/{getline; gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')

            xcodebuild \
              -project "$BUILD_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$CM_BUILD_DIR/Brahmanand.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Create IPA
        script: |
          set -e

          APP_PATH=$(find "$CM_BUILD_DIR/Brahmanand.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"

          cd "$CM_BUILD_DIR/ipa"
          zip -qr "$CM_BUILD_DIR/Brahmanand.ipa" Payload

    artifacts:
      - $CM_BUILD_DIR/Brahmanand.ipa
      - $CM_BUILD_DIR/Brahmanand.xcarchive/**
